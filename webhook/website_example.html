<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Switch — Web Kontrol</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { font: 15px system-ui, sans-serif; background: #0f172a; color: #cbd5e1;
         display: flex; justify-content: center; align-items: center; min-height: 100vh }
  .card { background: #1e293b; border-radius: 12px; padding: 2rem; width: 320px;
          box-shadow: 0 25px 50px rgba(0,0,0,.5) }
  h1 { font-size: 1.2rem; color: #f1f5f9; margin-bottom: .25rem }
  .sub { font-size: .8rem; color: #475569; margin-bottom: 1.5rem }
  .status { display: flex; align-items: center; gap: .5rem; font-size: .85rem;
            margin-bottom: 1.5rem; padding: .6rem .8rem; border-radius: 8px;
            background: #0f172a }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #334155;
         flex-shrink: 0; transition: background .3s }
  .dot.online { background: #22c55e }
  .dot.offline { background: #ef4444 }
  .btn { display: block; width: 100%; padding: .75rem; border: none;
         border-radius: 8px; font-size: .95rem; font-weight: 600;
         cursor: pointer; margin-top: .75rem; transition: opacity .15s }
  .btn:disabled { opacity: .5; cursor: not-allowed }
  .btn-power { background: #3b82f6; color: #fff }
  .btn-power:hover:not(:disabled) { opacity: .85 }
  .btn-reset { background: #1e293b; color: #f97316;
               border: 1px solid #f9741640 }
  .btn-reset:hover:not(:disabled) { background: #f974160d }
  .msg { font-size: .8rem; color: #64748b; text-align: center;
         margin-top: 1rem; min-height: 1.2em }
  .msg.ok { color: #22c55e }
  .msg.err { color: #ef4444 }
</style>
</head>
<body>
<div class="card">
  <h1>⚡ PC Switch</h1>
  <p class="sub">Uzaktan Güç Kontrolü</p>

  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="status-text">Kontrol ediliyor...</span>
  </div>

  <button class="btn btn-power" id="btn-power" onclick="sendCommand('power')" disabled>
    Güç Düğmesi
  </button>
  <button class="btn btn-reset" id="btn-reset" onclick="sendCommand('reset')" disabled>
    Reset
  </button>

  <p class="msg" id="msg"></p>
</div>

<script>
  // ── Ayarlar ──────────────────────────────────────────────────────────────
  // Bu değerleri kendi sunucunuzla değiştirin.
  // API anahtarını frontend'e gömmek yerine backend proxy kullanmak daha güvenlidir.
  const WEBHOOK_URL = "https://your-webhook-server.com";
  const API_KEY     = "webhook-api-anahtariniz";   // ⚠️ Üretimde backend'e taşıyın
  // ─────────────────────────────────────────────────────────────────────────

  const dot        = document.getElementById("dot");
  const statusText = document.getElementById("status-text");
  const msg        = document.getElementById("msg");
  const btnPower   = document.getElementById("btn-power");
  const btnReset   = document.getElementById("btn-reset");

  function setStatus(online, detail = "") {
    dot.className = "dot " + (online ? "online" : "offline");
    statusText.textContent = online
      ? `Çevrimiçi${detail ? " — " + detail : ""}`
      : "Çevrimdışı";
    btnPower.disabled = !online;
    btnReset.disabled = !online;
  }

  function showMsg(text, type = "") {
    msg.textContent = text;
    msg.className   = "msg " + type;
    if (type === "ok") setTimeout(() => { msg.textContent = ""; msg.className = "msg"; }, 3000);
  }

  async function apiFetch(path, method = "GET") {
    const res = await fetch(WEBHOOK_URL + path, {
      method,
      headers: { "X-API-Key": API_KEY },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || res.statusText);
    }
    return res.json();
  }

  async function checkStatus() {
    try {
      const data = await apiFetch("/api/status");
      const rssi = data.rssi ? ` RSSI: ${data.rssi} dBm` : "";
      setStatus(true, rssi);
    } catch (e) {
      setStatus(false);
      // /api/status 504 dönerse cihaz var ama PC kapalı olabilir
      if (e.message.includes("yanıt gelmedi")) setStatus(true, "PC kapalı olabilir");
    }
  }

  async function sendCommand(action) {
    btnPower.disabled = true;
    btnReset.disabled = true;
    showMsg("Gönderiliyor...");
    try {
      await apiFetch("/api/" + action, "POST");
      showMsg(action === "power" ? "✓ Güç komutu gönderildi" : "✓ Reset komutu gönderildi", "ok");
    } catch (e) {
      showMsg("Hata: " + e.message, "err");
    } finally {
      btnPower.disabled = false;
      btnReset.disabled = false;
    }
  }

  // Sayfa yüklendiğinde ve her 30s'de durum kontrol et
  checkStatus();
  setInterval(checkStatus, 30_000);
</script>
</body>
</html>
